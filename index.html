<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞机大战 v2.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #06091a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", monospace;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    /* 深空渐变底盘：canvas 边缘留黑时也有层次 */
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(56,92,190,.35), transparent 60%),
      radial-gradient(90% 80% at 85% 85%, rgba(140,70,200,.22), transparent 60%),
      linear-gradient(180deg, #05070f, #0a1030 48%, #04060f);
    background-attachment: fixed;
  }
  canvas {
    display: block;
    background: #04060f;
    image-rendering: auto;
    flex-shrink: 0;       /* 防止 flex 布局压扁 canvas，保证 cover 两侧溢出被外层裁掉 */
    max-width: none;
  }
  .touch-ui {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: none; justify-content: space-between;
    padding: 0 40px;
    z-index: 10; pointer-events: none;
  }
  .touch-ui .tbtn {
    pointer-events: auto;
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(16,28,52,.45);
    border: 1px solid rgba(130,205,255,.45);
    color: #eaf6ff; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
    box-shadow: 0 0 16px rgba(80,180,255,.16), inset 0 1px 0 rgba(255,255,255,.14);
    transition: transform .08s ease;
  }
  .touch-ui .tbtn:active {
    transform: scale(.93);
    background: rgba(26,40,84,.5);
  }
  @media (pointer: coarse) {
    .touch-ui.show { display: flex; }
  }
  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(110% 80% at 50% 20%, rgba(60,110,220,.4), transparent 62%),
      radial-gradient(90% 70% at 85% 90%, rgba(150,70,210,.3), transparent 60%),
      linear-gradient(180deg, #060b1f, #0a1130 50%, #04060f);
    transition: opacity .5s ease;
  }
  .loader-card { text-align: center; width: min(300px, 70vw); }
  .loader-title {
    color: #8ff2ff; font-size: 30px; font-weight: bold;
    letter-spacing: 6px; margin-bottom: 26px;
    text-shadow: 0 0 14px rgba(94,230,255,.8), 0 0 30px rgba(94,230,255,.4);
  }
  .loader-track {
    height: 10px; border-radius: 6px;
    background: rgba(255,255,255,.1);
    overflow: hidden; border: 1px solid rgba(150,210,255,.28);
    box-shadow: inset 0 0 8px rgba(0,0,0,.5);
  }
  .loader-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #5ee6ff 0%, #8ff2ff 50%, #5ee6ff 100%);
    background-size: 200% 100%;
    border-radius: 6px;
    transition: width .25s ease;
    box-shadow: 0 0 12px rgba(94,230,255,.8);
    animation: loaderShimmer 1.6s linear infinite;
  }
  @keyframes loaderShimmer {
    0% { background-position: 0% 0; }
    100% { background-position: -200% 0; }
  }
  .loader-text { margin-top: 12px; color: rgba(255,255,255,.7); font-size: 14px; text-shadow: 0 0 6px rgba(0,0,0,.6); }
  .loader-spin {
    width: 28px; height: 28px; margin: 18px auto 0;
    border: 3px solid rgba(94,230,255,.2);
    border-top-color: #5ee6ff;
    border-radius: 50%;
    animation: loaderSpin 1s linear infinite;
  }
  @keyframes loaderSpin { to { transform: rotate(360deg); } }
  /* ---------- 反馈面板 ---------- */
  .fb-mask {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(4,7,16,.78);
    display: none; align-items: center; justify-content: center;
  }
  .fb-mask.show { display: flex; }
  .fb-panel {
    width: min(92vw, 380px);
    background: #101828;
    border: 1px solid rgba(150,210,255,.4);
    border-radius: 16px;
    padding: 20px 18px 16px;
    box-shadow: 0 0 30px rgba(80,170,255,.25), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .fb-title { color: #8ff2ff; font-size: 18px; font-weight: bold; letter-spacing: 3px; margin-bottom: 6px; }
  .fb-tip { color: rgba(255,255,255,.5); font-size: 12px; margin-bottom: 12px; }
  .fb-input {
    width: 100%; height: 120px; resize: none;
    background: rgba(6,10,22,.9);
    border: 1px solid rgba(120,190,255,.35);
    border-radius: 10px;
    color: #eaf6ff; font-size: 14px; line-height: 1.6;
    padding: 10px 12px; outline: none;
    font-family: inherit;
  }
  .fb-input:focus { border-color: #5ee6ff; box-shadow: 0 0 10px rgba(94,230,255,.3); }
  .fb-actions { display: flex; gap: 10px; margin-top: 14px; }
  .fb-btn {
    flex: 1; height: 40px; border-radius: 10px;
    font-size: 15px; font-weight: bold; letter-spacing: 2px;
    cursor: pointer; border: none; font-family: inherit;
    touch-action: manipulation;
  }
  .fb-btn-submit { background: #2f7bff; color: #fff; }
  .fb-btn-submit:hover { background: #4a90ff; }
  .fb-btn-close { background: rgba(255,255,255,.08); color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.2); }
  .fb-status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 16px; }
  .fb-status.ok { color: #7CFC00; }
  .fb-status.err { color: #ff6b6b; }
</style>
</head>
<body>
<!-- 加载进度条：资源(模块)加载完成前替代黑屏。慢网络下持续转圈，不报失败 -->
<div id="loader">
  <div class="loader-card">
    <div class="loader-title">飞机大战</div>
    <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    <div class="loader-text" id="loaderText">加载中… 0%</div>
    <div class="loader-spin"></div>
  </div>
</div>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
</div>
<div id="fallback" style="display:none; position:fixed; inset:0; z-index:200; background:#05070f; color:#ff6b6b; font-size:18px; line-height:1.8; text-align:center; align-items:center; justify-content:center; flex-direction:column; padding:40px; box-sizing:border-box;">
  <div style="font-size:28px; font-weight:bold; letter-spacing:4px; margin-bottom:20px;">⚠ 加载失败</div>
  <pre id="errBox" style="background:rgba(255,255,255,.08); padding:16px; border-radius:8px; font-size:14px; color:#ffd166; max-width:600px; white-space:pre-wrap; text-align:left;"></pre>
</div>
<div class="touch-ui">
  <div class="tbtn" id="btnLeft">◀</div>
  <div class="tbtn" id="btnRight">▶</div>
</div>
<!-- 反馈面板 -->
<div class="fb-mask" id="fbMask">
  <div class="fb-panel">
    <div class="fb-title">反  馈</div>
    <div class="fb-tip">说说你的建议或遇到的问题，提交后写入服务器日志并推送到微信</div>
    <textarea class="fb-input" id="fbInput" placeholder="请填写反馈内容…" maxlength="1000"></textarea>
    <div class="fb-actions">
      <button class="fb-btn fb-btn-close" id="fbCancel">取消</button>
      <button class="fb-btn fb-btn-submit" id="fbSubmit">提交反馈</button>
    </div>
    <div class="fb-status" id="fbStatus"></div>
  </div>
</div>
<script>
  window.__feedbackLoaded = false;
</script>
<script>
  window.__loaderProgress = 0;
  window.__doneLoading = function () {
    if (window.__loaderDone) return;
    window.__loaderDone = true;
    if (window.__loaderIv) clearInterval(window.__loaderIv);
    var bar = document.getElementById('loaderBar');
    var txt = document.getElementById('loaderText');
    if (bar) bar.style.width = '100%';
    if (txt) txt.textContent = '加载完成 100%';
    var el = document.getElementById('loader');
    setTimeout(function () { if (el) el.style.opacity = '0'; }, 150);
    setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 700);
  };

  // 1) 全局异常捕获：在页面上显示具体错误 + 移除 loading
  window.__errLog = [];
  window.addEventListener('error', function (e) {
    var msg = (e.filename ? e.filename.replace(/.*\//,'') + ':' + (e.lineno||'?') + ':' : '') + (e.message || e);
    window.__errLog.push(msg);
    console.error('[plane_war]', msg);
    window.__doneLoading();
    setTimeout(function () {
      var fb = document.getElementById('fallback');
      if (fb) {
        var box = document.getElementById('errBox');
        if (box) box.textContent = '错误信息：\n' + window.__errLog.join('\n');
        fb.style.display = 'flex';
      }
    }, 800);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var msg = (e.reason && e.reason.message) || String(e.reason);
    window.__errLog.push(msg);
    console.error('[plane_war] Promise:', msg);
    window.__doneLoading();
  });

  // 2) 进度条缓慢前进到 90%（模拟资源下载），__doneLoading 到 100%。
  //    慢网络下会一直停在 90% 转圈——这是期望行为：宁可让用户等，也不要因为
  //    「超时」就提示加载失败。模块真正加载完会触发 __doneLoading 直接跳到 100%。
  (function () {
    var bar = document.getElementById('loaderBar');
    var txt = document.getElementById('loaderText');
    var slowSince = 0;
    window.__loaderIv = setInterval(function () {
      if (window.__loaderDone) return;
      if (window.__loaderProgress < 90) {
        // 前期快速推进到 90%；停在 90% 后不再增长，等模块就绪
        window.__loaderProgress += 3 + Math.random() * 8;
        if (window.__loaderProgress > 90) window.__loaderProgress = 90;
      }
      if (bar) bar.style.width = Math.round(window.__loaderProgress) + '%';
      if (txt) {
        // 卡在 90% 超过 6 秒就改成"仍在加载"提示，但不报失败
        if (window.__loaderProgress >= 90) {
          if (slowSince === 0) slowSince = Date.now();
          if (Date.now() - slowSince > 6000) {
            txt.textContent = '正在加载资源，请稍候…';
          } else {
            txt.textContent = '加载中… ' + Math.round(window.__loaderProgress) + '%';
          }
        } else {
          txt.textContent = '加载中… ' + Math.round(window.__loaderProgress) + '%';
        }
      }
    }, 250);
  })();

  // 3) 不再有"超时强制失败"：网络慢时进度条停在 90% 持续转圈，直到模块就绪。
  //    唯一会触发 fallback 的是真正的 JS 异常（上面的 error / unhandledrejection）。
</script>
<!--
  入口模块：优先加载部署生成的版本化副本（文件名带版本号 = 换路径 = 必然缓存未命中，
  这是破除 Byethost 按路径缓存旧模块的手段）。
  失败则回退到源模块 js/game.js——否则本地直接 `python3 -m http.server` 打开
  一定是 404 + 满屏"加载失败"，而版本化副本只在部署时才生成。
  用动态 import 而非 <script src>：404 只表现为 Promise reject（已被 catch），
  不会冒泡成 window error 去误触发上面的错误兜底。
-->
<script type="module">
  import("./js/game.v__VERSION__.js").catch(function () {
    return import("./js/game.js");
  });
</script>
</body>
</html>
