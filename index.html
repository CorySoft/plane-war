<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞机大战 v2.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05070f;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", monospace;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    background: #05070f;
    image-rendering: auto;
    flex-shrink: 0;       /* 防止 flex 布局压扁 canvas，保证 cover 两侧溢出被外层裁掉 */
    max-width: none;
  }
  .touch-ui {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: none; justify-content: space-between;
    padding: 0 40px;
    z-index: 10; pointer-events: none;
  }
  .touch-ui .tbtn {
    pointer-events: auto;
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.25);
    color: #cfeaff; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  @media (pointer: coarse) {
    .touch-ui { display: flex; }
  }
  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #05070f;
    transition: opacity .5s ease;
  }
  .loader-card { text-align: center; width: min(300px, 70vw); }
  .loader-title {
    color: #5ee6ff; font-size: 30px; font-weight: bold;
    letter-spacing: 6px; margin-bottom: 26px;
  }
  .loader-track {
    height: 10px; border-radius: 6px;
    background: rgba(255,255,255,.08);
    overflow: hidden; border: 1px solid rgba(255,255,255,.12);
  }
  .loader-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4cc9f0, #5ee6ff);
    border-radius: 6px;
    transition: width .25s ease;
  }
  .loader-text { margin-top: 12px; color: rgba(255,255,255,.55); font-size: 14px; }
</style>
</head>
<body>
<!-- 加载进度条：资源(模块)加载完成前替代黑屏 -->
<div id="loader">
  <div class="loader-card">
    <div class="loader-title">飞机大战</div>
    <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    <div class="loader-text" id="loaderText">加载中… 0%</div>
  </div>
</div>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
</div>
<div id="fallback" style="display:none; position:fixed; inset:0; z-index:200; background:#05070f; color:#ff6b6b; font-size:18px; line-height:1.8; text-align:center; align-items:center; justify-content:center; flex-direction:column; padding:40px; box-sizing:border-box;">
  <div style="font-size:28px; font-weight:bold; letter-spacing:4px; margin-bottom:20px;">⚠ 加载失败</div>
  <pre id="errBox" style="background:rgba(255,255,255,.08); padding:16px; border-radius:8px; font-size:14px; color:#ffd166; max-width:600px; white-space:pre-wrap; text-align:left;"></pre>
</div>
<div class="touch-ui">
  <div class="tbtn" id="btnLeft">◀</div>
  <div class="tbtn" id="btnRight">▶</div>
</div>
<script>
  window.__loaderProgress = 0;
  window.__doneLoading = function () {
    if (window.__loaderDone) return;
    window.__loaderDone = true;
    if (window.__loaderIv) clearInterval(window.__loaderIv);
    var bar = document.getElementById('loaderBar');
    var txt = document.getElementById('loaderText');
    if (bar) bar.style.width = '100%';
    if (txt) txt.textContent = '加载完成 100%';
    var el = document.getElementById('loader');
    setTimeout(function () { if (el) el.style.opacity = '0'; }, 150);
    setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 700);
  };

  // 1) 全局异常捕获：在页面上显示具体错误 + 移除 loading
  window.__errLog = [];
  window.addEventListener('error', function (e) {
    var msg = (e.filename ? e.filename.replace(/.*\//,'') + ':' + (e.lineno||'?') + ':' : '') + (e.message || e);
    window.__errLog.push(msg);
    console.error('[plane_war]', msg);
    window.__doneLoading();
    setTimeout(function () {
      var fb = document.getElementById('fallback');
      if (fb) {
        var box = document.getElementById('errBox');
        if (box) box.textContent = '错误信息：\n' + window.__errLog.join('\n');
        fb.style.display = 'flex';
      }
    }, 800);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var msg = (e.reason && e.reason.message) || String(e.reason);
    window.__errLog.push(msg);
    console.error('[plane_war] Promise:', msg);
    window.__doneLoading();
  });

  // 2) 进度条缓慢前进到 90%（模拟资源下载），__doneLoading 到 100%
  (function () {
    var bar = document.getElementById('loaderBar');
    var txt = document.getElementById('loaderText');
    window.__loaderIv = setInterval(function () {
      if (window.__loaderDone) return;
      if (window.__loaderProgress < 90) {
        window.__loaderProgress += 3 + Math.random() * 8;
        if (window.__loaderProgress > 90) window.__loaderProgress = 90;
      }
      if (bar) bar.style.width = Math.round(window.__loaderProgress) + '%';
      if (txt) txt.textContent = '加载中… ' + Math.round(window.__loaderProgress) + '%';
    }, 120);
  })();

  // 3) 兜底：超过 4 秒还没跳到 100% → 强制隐藏 loading
  setTimeout(function () {
    if (!window.__loaderDone) {
      console.warn('[plane_war] 加载超时，强制结束 loading');
      window.__doneLoading();
    }
  }, 4000);

  // 4) 如果 5 秒后 game 仍未标记启动成功，说明 ESM 模块整体加载失败（如 file://），显示 fallback
  setTimeout(function () {
    if (!window.__gameReady && !window.__loaderDone) {
      var fb = document.getElementById('fallback');
      if (fb) fb.style.display = 'flex';
    }
  }, 5000);
</script>
<script type="module" src="js/game.js"></script>
<!-- 非 ESM 兜底脚本：ESM 在 file:// 下整块失效，用普通脚本检测 game 是否启动成功 -->
<script>
  // 6 秒后若 __gameReady 未被模块标记 → 说明 ESM 整体加载失败（file:// 或不支持 ESM 的浏览器）
  setTimeout(function () {
    if (!window.__gameReady) {
      var fb = document.getElementById('fallback');
      if (fb) fb.style.display = 'flex';
    }
  }, 6000);

  // 兜底：5 秒后 loading 仍未消失 → 强制移除，让 fallback 可见
  setTimeout(function () {
    var el = document.getElementById('loader');
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }, 5000);
</script>
</body>
</html>
